<!DOCTYPE html>
<html manifest="slopkit.manifest">
<head>
<title>LEA GAMES</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.innerHTML="Loading LEA GAMES... " + Percent + "%";}
function DisplayCacheProgress(){window.msgs.innerHTML="Cache installed successfully";setTimeout(function(){window.msgs.innerHTML="Please reopen your browser";},1500);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="Cache not found";};
</script>
<h1>LEA GAMES</h1>
<hr>
<br>
<h1 id=msgs style="font-size: 30px;margin-top: 77px;margin-bottom: 455px;">Loading LEA GAMES...</h1>
</body>
</html>
